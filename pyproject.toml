[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "jupyter-notebook-comments"
version = "0.5.0"
description = "Cell comments stored inside .ipynb files for Jupyter Notebook 7"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

[tool.hatch.build.targets.wheel]
packages = ["jupyter_notebook_comments"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter_notebook_comments/labextension" = "share/jupyter/labextensions/jupyter-notebook-comments"
"install.json" = "share/jupyter/labextensions/jupyter-notebook-comments/install.json"

[tool.hatch.build.targets.sdist]
include = ["src", "style", "tests", "examples", "jupyter_notebook_comments", "package.json", "package-lock.json", "tsconfig*.json", "pyproject.toml", "install.json", "install.py", "README.md", "README.ko.md", "UPDATING.md", "VALIDATION.md", "preview.png", "CHANGELOG.md", "LICENSE"]
